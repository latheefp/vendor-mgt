# Namespace-scoped CI identity for GitHub Actions.
#
# Grants only what the deploy workflow needs: read/patch the gvs-app
# Deployment in the egrand namespace. No cluster-admin, no access to
# other apps' Secrets or resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vendor-mgt-ci
  namespace: egrand
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vendor-mgt-ci-deployer
  namespace: egrand
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gvs-app"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vendor-mgt-ci-deployer-binding
  namespace: egrand
subjects:
  - kind: ServiceAccount
    name: vendor-mgt-ci
    namespace: egrand
roleRef:
  kind: Role
  name: vendor-mgt-ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# K8s 1.24+ no longer auto-creates a token Secret for a ServiceAccount;
# this annotation tells the token controller to populate one.
apiVersion: v1
kind: Secret
metadata:
  name: vendor-mgt-ci-token
  namespace: egrand
  annotations:
    kubernetes.io/service-account.name: vendor-mgt-ci
type: kubernetes.io/service-account-token
