# gvs-secrets
#
# Placeholder values only — DO NOT put real credentials in this file.
# Fill in the real values with kubectl and apply directly, e.g.:
#
#   kubectl create secret generic gvs-secrets \
#     --namespace egrand \
#     --from-literal=DB_HOST=<same host as the db-credentials secret> \
#     --from-literal=DB_USERNAME=vendormgt \
#     --from-literal=DB_PASSWORD=<db password> \
#     --from-literal=REDIS_HOST=<same host as the db-credentials secret> \
#     --from-literal=REDIS_PASSWORD=<redis password, or leave empty> \
#     --from-literal=SECURITY_SALT=<openssl rand -hex 32> \
#     --from-literal=S3_ENDPOINT= \
#     --from-literal=S3_KEY= \
#     --from-literal=S3_SECRET= \
#     --from-literal=EMAIL_HOST= \
#     --from-literal=EMAIL_USERNAME= \
#     --from-literal=EMAIL_PASSWORD=
#
# This file is kept for reference (what keys the Deployment expects) —
# never `kubectl apply -f` it with these placeholders still in place.
apiVersion: v1
kind: Secret
metadata:
  name: gvs-secrets
  namespace: egrand
type: Opaque
stringData:
  DB_HOST: "CHANGE_ME"          # same MySQL host as the db-credentials secret
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  REDIS_HOST: "CHANGE_ME"       # same Redis host as the db-credentials secret
  REDIS_PASSWORD: ""
  SECURITY_SALT: "CHANGE_ME"    # generate with: openssl rand -hex 32
  S3_ENDPOINT: ""
  S3_KEY: ""
  S3_SECRET: ""
  EMAIL_HOST: ""
  EMAIL_USERNAME: ""
  EMAIL_PASSWORD: ""
