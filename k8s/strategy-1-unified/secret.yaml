# gvs-secrets
#
# `data:` values are base64, NOT encryption — anyone who can read this
# file can decode them. DB_PASSWORD and SECURITY_SALT below are still
# just the placeholder "CHANGE_ME" (base64 Q0hBTkdFX01F) — DO NOT
# `kubectl apply -f` this file until you replace them with the real
# values' base64 encoding, e.g.:
#
#   echo -n 'the real password' | base64
#
# then paste the result in place of DB_PASSWORD/SECURITY_SALT's value.
# This file is kept for reference (what keys the Deployment expects).
apiVersion: v1
kind: Secret
metadata:
  name: gvs-secrets
  namespace: egrand
type: Opaque
data:
  DB_HOST: MTA0LjIyNS4yMTYuNDM=          # 104.225.216.43
  DB_USERNAME: dmVuZG9yLW1uZ3Q=          # vendor-mngt
  DB_PASSWORD: Q0hBTkdFX01F              # CHANGE_ME — never commit the real value, set via kubectl or the GitHub Actions secret
  REDIS_HOST: cmVkaXMtaG9zdA==           # redis-host
  REDIS_PASSWORD: ""                     # empty — no auth on the shared redis-host instance
  SECURITY_SALT: Q0hBTkdFX01F            # CHANGE_ME — generate with: openssl rand -hex 32 | base64
  S3_ENDPOINT: ""
  S3_KEY: ""
  S3_SECRET: ""
  EMAIL_HOST: ""
  EMAIL_USERNAME: ""
  EMAIL_PASSWORD: ""
