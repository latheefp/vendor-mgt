apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvs-app
  namespace: egrand
  labels:
    app.kubernetes.io/name: gvs-app
    app.kubernetes.io/part-of: grand-vendorservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gvs-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gvs-app
    spec:
      volumes:
      - name: uploads
        nfs:
          server: 104.225.216.43
          path: /apps/share/vendormgt
      containers:
      - name: app
        image: ghcr.io/latheefp/gvs-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: uploads
          mountPath: /app/webroot/uploads
        env:
        # ---- non-sensitive app config ----
        - name: APP_NAME
          value: "Grand VendorService"
        - name: DEBUG
          value: "false"
        - name: APP_ENCODING
          value: "UTF-8"
        - name: APP_DEFAULT_LOCALE
          value: "en_IN"
        - name: APP_DEFAULT_TIMEZONE
          value: "Asia/Kolkata"
        - name: APP_FULL_BASE_URL
          value: "https://vendor-mgt.egrand.in"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "vendor-mngt"
        - name: CACHE_ENGINE
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        # Distinct prefix/index so this app doesn't collide with other
        # apps on the same shared Redis instance.
        - name: REDIS_PREFIX
          value: "vendor"
        - name: REDIS_DATABASE
          value: "1"
        - name: S3_BUCKET
          value: "gvs-evidence"
        - name: S3_REGION
          value: "auto"
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_TLS
          value: "true"
        - name: EMAIL_FROM
          value: "service@vendor-mgt.egrand.in"
        # ---- sensitive values, from the gvs-secrets Secret ----
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: DB_HOST
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: REDIS_HOST
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: REDIS_PASSWORD
              optional: true
        - name: SECURITY_SALT
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: SECURITY_SALT
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: S3_ENDPOINT
              optional: true
        - name: S3_KEY
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: S3_KEY
              optional: true
        - name: S3_SECRET
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: S3_SECRET
              optional: true
        - name: EMAIL_HOST
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: EMAIL_HOST
              optional: true
        - name: EMAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: EMAIL_USERNAME
              optional: true
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gvs-secrets
              key: EMAIL_PASSWORD
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
