name: Build, push and deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          docker build . --build-arg "GIT_COMMIT=$GIT_COMMIT" -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT" "app=$IMAGE_NAME:${{ github.sha }}"
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT"
